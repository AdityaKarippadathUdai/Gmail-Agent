<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 950">

<!-- BACKGROUND -->

<rect width="1700" height="950" fill="#ffffff"/>

<!-- GRID -->

<g opacity="0.04">

<line x1="0" y1="100" x2="1700" y2="100" stroke="#000"/>
<line x1="0" y1="200" x2="1700" y2="200" stroke="#000"/>
<line x1="0" y1="300" x2="1700" y2="300" stroke="#000"/>
<line x1="0" y1="400" x2="1700" y2="400" stroke="#000"/>
<line x1="0" y1="500" x2="1700" y2="500" stroke="#000"/>
<line x1="0" y1="600" x2="1700" y2="600" stroke="#000"/>
